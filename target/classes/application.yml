server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: case-execute-service

# 日志配置
logging:
  level:
    com.caseexecute: debug
    org.springframework.web: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/case-execute-service.log
    max-size: 10MB
    max-history: 30

# 文件上传配置
file:
  upload:
    # 上传文件存储路径
    path: /tmp/case-execute/uploads/
    # 最大文件大小
    max-size: 100MB
    # 允许的文件类型
    allowed-types: .zip,.xlsx,.xls,.py,.txt

# 用例执行配置
case:
  execution:
    # 单个用例执行超时时长（分钟），默认5分钟
    timeout-minutes: 5
    # 日志输出配置
    log:
      # 是否启用实时日志输出到控制台
      enable-real-time-console-output: true
      # 是否启用日志文件输出
      enable-file-output: true
      # 日志输出级别过滤（INFO, DEBUG, WARN, ERROR）
      log-level: INFO
      # 是否显示时间戳
      show-timestamp: true
      # 是否显示用例信息前缀
      show-test-case-prefix: true
    # 文件存储配置
    file-storage:
      # 文件存储根目录
      root-directory: D:/opt
      # 是否在任务完成后自动清理文件
      auto-cleanup: true
      # 文件保留时间（小时），超过此时间自动清理
      retention-hours: 24
      # 最大并发任务数
      max-concurrent-tasks: 10
      # 单个任务最大文件大小（MB）
      max-file-size-mb: 1000

# gohttpserver配置
gohttpserver:
  url: http://localhost:8081

# WebSocket客户端配置
websocket:
  client:
    # 后台服务WebSocket地址（需要根据实际部署的公网IP修改）
    server-url: ws://localhost:8080/api/ws/executor
    # 是否启用WebSocket连接
    enabled: true
    # 重连间隔（秒）
    reconnect-interval: 30
    # 心跳间隔（秒）
    heartbeat-interval: 30
    # 连接超时时间（秒）
    connection-timeout: 10
    # 执行机地域信息配置（用于注册时发送给后台服务）
    region:
      # 地域名称（片区，level=1），可通过启动参数覆盖：--websocket.client.region.region-name=亚洲
      region-name: 
      # 国家名称（level=2），可通过启动参数覆盖：--websocket.client.region.country-name=中国
      country-name: 
      # 省份名称（level=3），可通过启动参数覆盖：--websocket.client.region.province-name=北京
      province-name: 
      # 城市名称（level=4），可通过启动参数覆盖：--websocket.client.region.city-name=北京
      city-name:
